# Verificação de todo PR e de todo push na main. Nada aqui toca nos bancos
# de testes ou de produção: o banco usado é descartável, criado no runner.
name: Verificação

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  functions:
    name: Edge Functions (tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts

  database:
    name: Banco (migrações do zero e testes de acesso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # sobe só o Postgres e aplica todas as migrações, da 001 em diante
      - run: supabase db start
      - run: supabase test db
